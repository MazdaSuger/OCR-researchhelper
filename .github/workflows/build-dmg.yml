name: Build macOS DMG

# 手動実行（extras を指定可能）と、バージョンタグ push 時に DMG をビルドする。
on:
  workflow_dispatch:
    inputs:
      extras:
        description: "同梱する pip extras（カンマ区切り）。既定はフル機能。"
        required: false
        default: "ocr,nlp,viz,export"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # タグビルドで Release へ添付するため

jobs:
  build:
    name: ${{ matrix.arch }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-13, arch: x86_64 }   # Intel
          - { runner: macos-14, arch: arm64 }    # Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR runtime (tesseract + 言語 + dylibbundler)
        run: |
          brew update
          brew install tesseract tesseract-lang dylibbundler || true
          tesseract --version | head -1
          tesseract --list-langs || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          EXTRAS="${{ github.event.inputs.extras }}"
          EXTRAS="${EXTRAS:-ocr,nlp,viz,export}"
          echo "Installing with extras: [$EXTRAS]"
          pip install -e ".[$EXTRAS]"
          pip install pyinstaller

      - name: Generate app icon (.icns)
        run: bash packaging/make_icon.sh

      - name: Build .app with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/Shiryo-Coder.spec

      - name: Bundle tesseract into the .app
        run: bash packaging/bundle_tesseract.sh dist/Shiryo-Coder.app

      - name: Smoke test (app init + bundled tesseract)
        run: |
          APP="dist/Shiryo-Coder.app/Contents/MacOS"
          QT_QPA_PLATFORM=offscreen "$APP/Shiryo-Coder" --init-only
          "$APP/tesseract" --version | head -1     # 同梱 dylib が解決されることを確認

      - name: Package as DMG
        run: bash packaging/make_dmg.sh "Shiryo-Coder-${{ matrix.arch }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shiryo-Coder-${{ matrix.arch }}
          path: dist/Shiryo-Coder-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Shiryo-Coder-${{ matrix.arch }}.dmg
